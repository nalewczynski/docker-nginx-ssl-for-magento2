server {
  listen 80;
  server_name _;

  root /var/www/html/magento2/pub;
  index index.php;

  client_max_body_size 64m;

  # Compression for text-based assets. Images/fonts are already compressed formats.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    application/javascript
    application/json
    application/xml
    font/woff
    font/woff2
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # Baseline security headers for every response from this vhost.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files $uri =204;
  }

  location = /robots.txt {
    access_log off;
    log_not_found off;
    allow all;
  }

  location /static/ {
    access_log off;
    log_not_found off;

    # Strip the cache-busting "versionXXXXXXXXXX" segment Magento adds to /static/ URLs.
    location ~ ^/static/version\d*/(.*)$ {
      rewrite ^/static/version\d*/(.*)$ /static/$1 last;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      expires max;
      try_files $uri @static_php;
    }

    location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store";
      expires off;
      try_files $uri @static_php;
    }

    try_files $uri @static_php;
  }

  # Named fallback used when a /static/ asset isn't physically deployed yet;
  # Magento's static.php will generate it on the fly (useful outside production mode).
  location @static_php {
    rewrite ^/static/?(.*)$ /static.php?resource=$1 last;
  }

  location /media/ {
    access_log off;
    log_not_found off;
    try_files $uri $uri/ /get.php$is_args$args;

    location ~ ^/media/theme_customization/.*\.xml$ {
      deny all;
    }

    location ~* \.(ico|jpg|jpeg|png|gif|svg|js|css|swf|eot|ttf|otf|woff|woff2)$ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "public, max-age=31536000, immutable";
      expires max;
      try_files $uri $uri/ /get.php$is_args$args;
    }

    location ~* \.(zip|gz|gzip|bz2|csv|xml)$ {
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Cache-Control "no-store";
      expires off;
      try_files $uri $uri/ /get.php$is_args$args;
    }
  }

  location / {
    try_files $uri $uri/ /index.php$is_args$args;
  }

  location ~ ^/(index|static|get)\.php$ {
    include fastcgi_params;
    fastcgi_pass app:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_read_timeout 600s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
  }

  location ~ \.php$ {
    return 404;
  }

  # Application source, config, vendor, and build-tooling directories must never be web-accessible.
  location ~* /(app|var|vendor|generated|setup|update)/ {
    deny all;
  }

  # Version control metadata.
  location ~* /\.(git|svn|hg)(/|$) {
    deny all;
  }

  # Any other dotfile (.env, .htaccess, .user.ini, etc.), except the well-known ACME challenge path.
  location ~* /\.(?!well-known).* {
    deny all;
  }

  # Composer/npm/build manifests and misc source-control files should never be served.
  location ~* /(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|auth\.json|Gruntfile\.js|gulpfile\.js|phpunit\.xml(\.dist)?)$ {
    deny all;
  }

  # Logs, dumps, and raw templates have no business being served over HTTP.
  location ~* \.(md|markdown|log|sql|sh|yml|yaml|dist|phtml|twig)$ {
    deny all;
  }
}
